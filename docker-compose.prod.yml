# Produção num só servidor: a app, o Postgres, a Evolution API (WhatsApp), o HTTPS e os backups.
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Ver docs/producao.md.
name: elevateone

x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@db:5432/elevateone?schema=public
  SESSION_SECRET: ${SESSION_SECRET:?}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
  APP_URL: https://${APP_DOMAIN:?}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
  ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  EVOLUTION_API_URL: http://evolution:8080
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?}
  EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-escritorio}
  WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:?}
  OFFICE_API_TOKEN: ${OFFICE_API_TOKEN:-}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: elevateone
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o banco da Evolution na primeira vez (e o de testes, que aqui não é usado).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elevateone"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Corre uma vez a cada arranque: aplica as migrations e garante o utilizador admin.
  migrate:
    build:
      context: .
      target: builder
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:?}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:?}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?}
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"

  # Uma só instância: a fila «uma mensagem de cada vez por número» vive na memória do processo.
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      NODE_ENV: production

  # A ponte para o WhatsApp. Não fica exposta à internet: gere-se por um túnel SSH (ver o guia).
  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD:?}@db:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Cópias diárias dos dois bancos para ./backups (7 dias, 4 semanas, 6 meses).
  # Ficam no mesmo servidor: copie-as também para fora dele.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: elevateone,evolution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups:/backups

volumes:
  pgdata:
  evolution_instances:
  caddy_data:
  caddy_config:
